services:
  - type: web
    name: omh-social-services
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: omh-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
