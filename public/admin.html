<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت - OMH Social Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Admin styles - compact version */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f7f0; color: #1a2e1a; direction: rtl; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* Login */
        .login-container { max-width: 400px; margin: 100px auto; padding: 40px; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); }
        .login-container h1 { text-align: center; margin-bottom: 24px; font-size: 1.5rem; color: #0a1a0a; }
        .login-container input { width: 100%; padding: 14px; border: 2px solid #e0ece0; border-radius: 12px; font-size: 1rem; margin-bottom: 16px; }
        .login-container button { width: 100%; padding: 14px; background: #2d8f4e; color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .login-container .error { color: #e74c3c; text-align: center; margin-top: 12px; display: none; }
        
        /* Admin Layout */
        .admin-header { background: #fff; padding: 16px 0; border-bottom: 1px solid #e0ece0; position: sticky; top: 0; z-index: 100; }
        .admin-header .container { display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { font-size: 1.3rem; font-weight: 800; color: #0a1a0a; }
        .admin-header .logout { color: #e74c3c; cursor: pointer; font-weight: 600; }
        
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; background: #fff; padding: 12px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .admin-tabs button { padding: 10px 20px; border: none; background: transparent; border-radius: 10px; font-weight: 600; cursor: pointer; color: #4a6a4a; transition: all 0.3s ease; }
        .admin-tabs button.active { background: #2d8f4e; color: #fff; }
        .admin-tabs button:hover:not(.active) { background: rgba(45,143,78,0.08); }
        
        .tab-content { display: none; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .tab-content.active { display: block; }
        
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #f8faf8; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card .number { font-size: 2rem; font-weight: 800; color: #1a6b3a; }
        .stat-card .label { color: #4a6a4a; font-size: 0.9rem; }
        
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .admin-table th { text-align: right; padding: 12px; background: #f8faf8; border-bottom: 2px solid #e0ece0; font-weight: 600; }
        .admin-table td { padding: 12px; border-bottom: 1px solid #f0f7f0; }
        .admin-table .actions { display: flex; gap: 8px; }
        .admin-table .actions button { padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-edit { background: #3498db; color: #fff; }
        .btn-delete { background: #e74c3c; color: #fff; }
        .btn-approve { background: #2d8f4e; color: #fff; }
        .btn-reject { background: #e67e22; color: #fff; }
        .btn-add { background: #2d8f4e; color: #fff; padding: 10px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 20px; padding: 32px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; font-size: 1.3rem; }
        .modal-content .form-group { margin-bottom: 14px; }
        .modal-content label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; color: #0a1a0a; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px 14px; border: 2px solid #e0ece0; border-radius: 10px; font-size: 0.95rem; font-family: inherit; }
        .modal-content textarea { resize: vertical; min-height: 80px; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
        .modal-actions button { padding: 10px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-save { background: #2d8f4e; color: #fff; }
        .btn-cancel { background: #e0ece0; color: #1a2e1a; }
        
        .badge { padding: 2px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-inactive { background: #f8d7da; color: #721c24; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        
        @media (max-width: 768px) {
            .admin-tabs button { font-size: 0.8rem; padding: 8px 14px; }
            .admin-table { font-size: 0.8rem; }
            .admin-table th, .admin-table td { padding: 8px; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginContainer" class="login-container">
    <h1>🔐 پنل مدیریت</h1>
    <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید" />
    <button id="loginBtn">ورود</button>
    <div id="loginError" class="error">رمز عبور اشتباه است</div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" style="display:none;">
    <div class="admin-header">
        <div class="container">
            <h1>⚙️ پنل مدیریت OMH</h1>
            <span class="logout" id="logoutBtn">خروج</span>
        </div>
    </div>
    
    <div class="container">
        <!-- Tabs -->
        <div class="admin-tabs">
            <button class="active" data-tab="dashboard">📊 داشبورد</button>
            <button data-tab="services">📦 خدمات</button>
            <button data-tab="categories">🏷️ دسته‌بندی</button>
            <button data-tab="announcements">📢 اعلانات</button>
            <button data-tab="reviews">💬 نظرات</button>
            <button data-tab="settings">⚙️ تنظیمات</button>
        </div>
        
        <!-- Dashboard -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="admin-stats" id="dashboardStats">
                <div class="stat-card"><div class="number" id="statServices">0</div><div class="label">خدمات</div></div>
                <div class="stat-card"><div class="number" id="statReviews">0</div><div class="label">نظرات</div></div>
                <div class="stat-card"><div class="number" id="statAnnouncements">0</div><div class="label">اعلانات فعال</div></div>
                <div class="stat-card"><div class="number" id="statPending">0</div><div class="label">نظرات در انتظار</div></div>
            </div>
            <p style="color:#4a6a4a;">به پنل مدیریت خوش آمدید. از تب‌های بالا برای مدیریت محتوا استفاده کنید.</p>
        </div>
        
        <!-- Services -->
        <div id="tab-services" class="tab-content">
            <button class="btn-add" onclick="openModal('service')">➕ افزودن سرویس جدید</button>
            <div id="servicesList"></div>
        </div>
        
        <!-- Categories -->
        <div id="tab-categories" class="tab-content">
            <button class="btn-add" onclick="openModal('category')">➕ افزودن دسته‌بندی جدید</button>
            <div id="categoriesList"></div>
        </div>
        
        <!-- Announcements -->
        <div id="tab-announcements" class="tab-content">
            <button class="btn-add" onclick="openModal('announcement')">➕ افزودن اعلان جدید</button>
            <div id="announcementsList"></div>
        </div>
        
        <!-- Reviews -->
        <div id="tab-reviews" class="tab-content">
            <div id="reviewsList"></div>
        </div>
        
        <!-- Settings -->
        <div id="tab-settings" class="tab-content">
            <h3 style="margin-bottom:20px;">تنظیمات سایت</h3>
            <form id="settingsForm">
                <div class="form-group">
                    <label>لینک WhatsApp</label>
                    <input type="url" id="setWhatsapp" placeholder="https://wa.me/..." />
                </div>
                <div class="form-group">
                    <label>لینک Telegram</label>
                    <input type="url" id="setTelegram" placeholder="https://t.me/..." />
                </div>
                <div class="form-group">
                    <label>کانال Telegram</label>
                    <input type="url" id="setTelegramChannel" placeholder="https://t.me/..." />
                </div>
                <div class="form-group">
                    <label>کانال WhatsApp</label>
                    <input type="url" id="setWhatsappChannel" placeholder="https://whatsapp.com/channel/..." />
                </div>
                <div class="form-group">
                    <label>عنوان هیرو</label>
                    <input type="text" id="setHeroTitle" />
                </div>
                <div class="form-group">
                    <label>توضیحات هیرو</label>
                    <textarea id="setHeroDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>نام برند</label>
                    <input type="text" id="setBrandName" />
                </div>
                <div class="form-group">
                    <label>زیرنویس برند</label>
                    <input type="text" id="setBrandSubtitle" />
                </div>
                <div class="form-group">
                    <label>آدرس لوگو</label>
                    <input type="url" id="setLogoUrl" placeholder="/images/logo.png" />
                </div>
                <button type="submit" class="btn-save" style="padding:12px 32px;border:none;border-radius:12px;font-weight:600;cursor:pointer;">💾 ذخیره تنظیمات</button>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">افزودن</h2>
        <form id="modalForm">
            <div id="modalFields"></div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">انصراف</button>
                <button type="submit" class="btn-save">ذخیره</button>
            </div>
        </form>
    </div>
</div>

<script>
// ==================== STATE ====================
let adminState = {
    services: [],
    categories: [],
    announcements: [],
    reviews: [],
    settings: {}
};

let modalType = '';
let editId = null;

// ==================== AUTH ====================
const loginContainer = document.getElementById('loginContainer');
const adminPanel = document.getElementById('adminPanel');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const loginError = document.getElementById('loginError');

async function checkAuth() {
    try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (data.isAdmin) {
            loginContainer.style.display = 'none';
            adminPanel.style.display = 'block';
            loadAllData();
        }
    } catch(e) {}
}

loginBtn.addEventListener('click', async () => {
    const password = document.getElementById('adminPassword').value;
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
            loginContainer.style.display = 'none';
            adminPanel.style.display = 'block';
            loginError.style.display = 'none';
            loadAllData();
        } else {
            loginError.style.display = 'block';
        }
    } catch(e) {
        loginError.style.display = 'block';
    }
});

logoutBtn.addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.reload();
});

// Enter key for login
document.getElementById('adminPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
});

// ==================== TABS ====================
document.querySelectorAll('.admin-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
});

// ==================== API HELPERS ====================
async function apiGet(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

async function apiPost(url, data) {
    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

async function apiPut(url, data) {
    const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

async function apiDelete(url) {
    const res = await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

// ==================== LOAD ALL DATA ====================
async function loadAllData() {
    await Promise.all([
        loadServices(),
        loadCategories(),
        loadAnnouncements(),
        loadReviews(),
        loadSettings(),
        loadStats()
    ]);
}

// ==================== SERVICES ====================
async function loadServices() {
    const data = await apiGet('/api/services/all');
    adminState.services = data;
    renderServices(data);
}

function renderServices(data) {
    const container = document.getElementById('servicesList');
    if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:#4a6a4a;">هیچ سرویسی ثبت نشده است.</p>';
        return;
    }
    let html = `<table class="admin-table">
        <thead><tr><th>عنوان</th><th>دسته‌بندی</th><th>قیمت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>`;
    data.forEach(s => {
        html += `<tr>
            <td>${s.title}</td>
            <td>${s.category || '-'}</td>
            <td>${s.price || '-'}</td>
            <td><span class="badge ${s.status === 'active' ? 'badge-active' : 'badge-inactive'}">${s.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
            <td class="actions">
                <button class="btn-edit" onclick="editService(${s.id})">ویرایش</button>
                <button class="btn-delete" onclick="deleteService(${s.id})">حذف</button>
            </td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function editService(id) {
    const item = adminState.services.find(s => s.id === id);
    if (!item) return;
    editId = id;
    modalType = 'service';
    document.getElementById('modalTitle').textContent = 'ویرایش سرویس';
    document.getElementById('modalFields').innerHTML = `
        <div class="form-group"><label>دسته‌بندی</label><input id="f_category" value="${item.category || ''}" /></div>
        <div class="form-group"><label>عنوان *</label><input id="f_title" value="${item.title}" required /></div>
        <div class="form-group"><label>توضیحات</label><textarea id="f_description">${item.description || ''}</textarea></div>
        <div class="form-group"><label>قیمت</label><input id="f_price" value="${item.price || ''}" /></div>
        <div class="form-group"><label>واحد</label><input id="f_unit" value="${item.unit || ''}" /></div>
        <div class="form-group"><label>آدرس تصویر</label><input id="f_image_url" value="${item.image_url || ''}" /></div>
        <div class="form-group"><label>آدرس آیکون</label><input id="f_icon_url" value="${item.icon_url || ''}" /></div>
        <div class="form-group"><label>وضعیت</label>
            <select id="f_status">
                <option value="active" ${item.status === 'active' ? 'selected' : ''}>فعال</option>
                <option value="inactive" ${item.status === 'inactive' ? 'selected' : ''}>غیرفعال</option>
            </select>
        </div>
        <div class="form-group"><label>ترتیب نمایش</label><input type="number" id="f_display_order" value="${item.display_order || 0}" /></div>
    `;
    openModalElement();
}

async function deleteService(id) {
    if (!confirm('آیا از حذف این سرویس اطمینان دارید؟')) return;
    await apiDelete(`/api/services/${id}`);
    loadServices();
}

// ==================== CATEGORIES ====================
async function loadCategories() {
    const data = await apiGet('/api/categories/all');
    adminState.categories = data;
    renderCategories(data);
}

function renderCategories(data) {
    const container = document.getElementById('categoriesList');
    if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:#4a6a4a;">هیچ دسته‌بندی ثبت نشده است.</p>';
        return;
    }
    let html = `<table class="admin-table">
        <thead><tr><th>نام</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>`;
    data.forEach(c => {
        html += `<tr>
            <td>${c.name}</td>
            <td><span class="badge ${c.status === 'active' ? 'badge-active' : 'badge-inactive'}">${c.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
            <td class="actions">
                <button class="btn-edit" onclick="editCategory(${c.id})">ویرایش</button>
                <button class="btn-delete" onclick="deleteCategory(${c.id})">حذف</button>
            </td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function editCategory(id) {
    const item = adminState.categories.find(c => c.id === id);
    if (!item) return;
    editId = id;
    modalType = 'category';
    document.getElementById('modalTitle').textContent = 'ویرایش دسته‌بندی';
    document.getElementById('modalFields').innerHTML = `
        <div class="form-group"><label>نام *</label><input id="f_name" value="${item.name}" required /></div>
        <div class="form-group"><label>آدرس آیکون</label><input id="f_icon_url" value="${item.icon_url || ''}" /></div>
        <div class="form-group"><label>توضیحات</label><textarea id="f_description">${item.description || ''}</textarea></div>
        <div class="form-group"><label>وضعیت</label>
            <select id="f_status">
                <option value="active" ${item.status === 'active' ? 'selected' : ''}>فعال</option>
                <option value="inactive" ${item.status === 'inactive' ? 'selected' : ''}>غیرفعال</option>
            </select>
        </div>
        <div class="form-group"><label>ترتیب نمایش</label><input type="number" id="f_display_order" value="${item.display_order || 0}" /></div>
    `;
    openModalElement();
}

async function deleteCategory(id) {
    if (!confirm('آیا از حذف این دسته‌بندی اطمینان دارید؟')) return;
    await apiDelete(`/api/categories/${id}`);
    loadCategories();
}

// ==================== ANNOUNCEMENTS ====================
async function loadAnnouncements() {
    const data = await apiGet('/api/announcements/all');
    adminState.announcements = data;
    renderAnnouncements(data);
}

function renderAnnouncements(data) {
    const container = document.getElementById('announcementsList');
    if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:#4a6a4a;">هیچ اعلانی ثبت نشده است.</p>';
        return;
    }
    let html = `<table class="admin-table">
        <thead><tr><th>عنوان</th><th>متن</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>`;
    data.forEach(a => {
        html += `<tr>
            <td>${a.title}</td>
            <td>${a.content}</td>
            <td><span class="badge ${a.status === 'active' ? 'badge-active' : 'badge-inactive'}">${a.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
            <td class="actions">
                <button class="btn-edit" onclick="editAnnouncement(${a.id})">ویرایش</button>
                <button class="btn-delete" onclick="deleteAnnouncement(${a.id})">حذف</button>
            </td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function editAnnouncement(id) {
    const item = adminState.announcements.find(a => a.id === id);
    if (!item) return;
    editId = id;
    modalType = 'announcement';
    document.getElementById('modalTitle').textContent = 'ویرایش اعلان';
    document.getElementById('modalFields').innerHTML = `
        <div class="form-group"><label>عنوان *</label><input id="f_title" value="${item.title}" required /></div>
        <div class="form-group"><label>متن *</label><textarea id="f_content" required>${item.content}</textarea></div>
        <div class="form-group"><label>تاریخ شروع</label><input type="datetime-local" id="f_start_date" value="${item.start_date ? item.start_date.slice(0,16) : ''}" /></div>
        <div class="form-group"><label>تاریخ پایان</label><input type="datetime-local" id="f_end_date" value="${item.end_date ? item.end_date.slice(0,16) : ''}" /></div>
        <div class="form-group"><label>وضعیت</label>
            <select id="f_status">
                <option value="active" ${item.status === 'active' ? 'selected' : ''}>فعال</option>
                <option value="inactive" ${item.status === 'inactive' ? 'selected' : ''}>غیرفعال</option>
            </select>
        </div>
    `;
    openModalElement();
}

async function deleteAnnouncement(id) {
    if (!confirm('آیا از حذف این اعلان اطمینان دارید؟')) return;
    await apiDelete(`/api/announcements/${id}`);
    loadAnnouncements();
}

// ==================== REVIEWS ====================
async function loadReviews() {
    const data = await apiGet('/api/reviews/all');
    adminState.reviews = data;
    renderReviews(data);
}

function renderReviews(data) {
    const container = document.getElementById('reviewsList');
    if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:#4a6a4a;">هیچ نظری ثبت نشده است.</p>';
        return;
    }
    let html = `<table class="admin-table">
        <thead><tr><th>مشتری</th><th>نظر</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>`;
    data.forEach(r => {
        const statusMap = {
            'pending': 'در انتظار',
            'approved': 'تأیید شده',
            'rejected': 'رد شده'
        };
        const statusClass = {
            'pending': 'badge-pending',
            'approved': 'badge-approved',
            'rejected': 'badge-inactive'
        };
        html += `<tr>
            <td>${r.customer_name}</td>
            <td>${r.content}</td>
            <td><span class="badge ${statusClass[r.status] || 'badge-pending'}">${statusMap[r.status] || r.status}</span></td>
            <td class="actions">
                ${r.status === 'pending' ? `
                    <button class="btn-approve" onclick="approveReview(${r.id})">تأیید</button>
                    <button class="btn-reject" onclick="rejectReview(${r.id})">رد</button>
                ` : ''}
                <button class="btn-edit" onclick="editReview(${r.id})">ویرایش</button>
                <button class="btn-delete" onclick="deleteReview(${r.id})">حذف</button>
            </td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

async function approveReview(id) {
    const item = adminState.reviews.find(r => r.id === id);
    if (!item) return;
    await apiPut(`/api/reviews/${id}`, { ...item, status: 'approved' });
    loadReviews();
}

async function rejectReview(id) {
    const item = adminState.reviews.find(r => r.id === id);
    if (!item) return;
    await apiPut(`/api/reviews/${id}`, { ...item, status: 'rejected' });
    loadReviews();
}

function editReview(id) {
    const item = adminState.reviews.find(r => r.id === id);
    if (!item) return;
    editId = id;
    modalType = 'review';
    document.getElementById('modalTitle').textContent = 'ویرایش نظر';
    document.getElementById('modalFields').innerHTML = `
        <div class="form-group"><label>نام مشتری *</label><input id="f_customer_name" value="${item.customer_name}" required /></div>
        <div class="form-group"><label>متن نظر *</label><textarea id="f_content" required>${item.content}</textarea></div>
        <div class="form-group"><label>آدرس آواتار</label><input id="f_avatar" value="${item.avatar || ''}" /></div>
        <div class="form-group"><label>وضعیت</label>
            <select id="f_status">
                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>در انتظار</option>
                <option value="approved" ${item.status === 'approved' ? 'selected' : ''}>تأیید شده</option>
                <option value="rejected" ${item.status === 'rejected' ? 'selected' : ''}>رد شده</option>
            </select>
        </div>
    `;
    openModalElement();
}

async function deleteReview(id) {
    if (!confirm('آیا از حذف این نظر اطمینان دارید؟')) return;
    await apiDelete(`/api/reviews/${id}`);
    loadReviews();
}

// ==================== SETTINGS ====================
async function loadSettings() {
    const data = await apiGet('/api/contact-settings');
    adminState.settings = data;
    document.getElementById('setWhatsapp').value = data.whatsapp_url || '';
    document.getElementById('setTelegram').value = data.telegram_url || '';
    document.getElementById('setTelegramChannel').value = data.telegram_channel || '';
    document.getElementById('setWhatsappChannel').value = data.whatsapp_channel || '';
    document.getElementById('setHeroTitle').value = data.hero_title || '';
    document.getElementById('setHeroDescription').value = data.hero_description || '';
    document.getElementById('setBrandName').value = data.brand_name || '';
    document.getElementById('setBrandSubtitle').value = data.brand_subtitle || '';
    document.getElementById('setLogoUrl').value = data.logo_url || '';
}

document.getElementById('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        whatsapp_url: document.getElementById('setWhatsapp').value,
        telegram_url: document.getElementById('setTelegram').value,
        telegram_channel: document.getElementById('setTelegramChannel').value,

        hero_title: document.getElementById('setHeroTitle').value,

    };

// ==================== STATS ====================
async function loadStats() {
    try {
        const data = await apiGet('/api/dashboard/stats');
        document.getElementById('statServices').textContent = data.services || 0;
        document.getElementById('statReviews').textContent = data.reviews || 0;
        document.getElementById('statAnnouncements').textContent = data.announcements || 0;
        document.getElementById('statPending').textContent = data.pendingReviews || 0;
    } catch(e) {}
}

                <select id="f_status"><option value="pending">در انتظار</option><option value="approved">تأیید شده</option><option value="rejected">رد شده</option></select>

function openModalElement() {
    document.getElementById('modal').classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    editId = null;
}

document.getElementById('modalForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const getVal = (id) => document.getElementById(id)?.value || '';
    
    try {
        if (modalType === 'service') {
            const data = {
                category: getVal('f_category'),
                title: getVal('f_title'),
                description: getVal('f_description'),
                price: getVal('f_price'),
                unit: getVal('f_unit'),
                image_url: getVal('f_image_url'),
                icon_url: getVal('f_icon_url'),
                status: getVal('f_status') || 'active',
                display_order: parseInt(getVal('f_display_order')) || 0
            };
            if (editId) {
                await apiPut(`/api/services/${editId}`, data);
            } else {
                await apiPost('/api/services', data);
            }
            loadServices();
        } else if (modalType === 'category') {
            const data = {
                name: getVal('f_name'),
                icon_url: getVal('f_icon_url'),
                description: getVal('f_description'),
                status: getVal('f_status') || 'active',
                display_order: parseInt(getVal('f_display_order')) || 0
            };
            if (editId) {
                await apiPut(`/api/categories/${editId}`, data);
            } else {
                await apiPost('/api/categories', data);
            }
            loadCategories();
        } else if (modalType === 'announcement') {
            const data = {
                title: getVal('f_title'),
                content: getVal('f_content'),
                start_date: getVal('f_start_date') || null,
                end_date: getVal('f_end_date') || null,
                status: getVal('f_status') || 'active'
            };
            if (editId) {
                await apiPut(`/api/announcements/${editId}`, data);
            } else {
                await apiPost('/api/announcements', data);
            }
            loadAnnouncements();
        } else if (modalType === 'review') {
            const data = {
                customer_name: getVal('f_customer_name'),
                content: getVal('f_content'),
                avatar: getVal('f_avatar') || null,
                status: getVal('f_status') || 'pending'
            };
            if (editId) {
                await apiPut(`/api/reviews/${editId}`, data);
            } else {
                await apiPost('/api/reviews', data);
            }
            loadReviews();
        }
        closeModal();
        loadStats();
    } catch(err) {
        alert('خطا در ذخیره: ' + err.message);
    }
});

// Close modal on backdrop click
document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
});
