<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMH Admin Panel</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body><div id="login" class="login"><div><h1>OMH <span>ADMIN</span></h1><p>مدیریت خدمات دیجیتال</p><form id="loginForm"><input id="password" type="password" placeholder="رمز مدیریت" required><button>ورود</button><small id="loginMsg"></small></form></div></div><div id="app" hidden><header><a href="/">OMH Social Services</a><button id="logout">خروج</button></header><main><div class="dash" id="stats"></div><div class="tabs"><button data-tab="catalog" class="active">ساختار خدمات</button><button data-tab="announce">اعلانات</button><button data-tab="reviews">نظرات</button><button data-tab="settings">تنظیمات</button></div><section id="catalog" class="tab active"><div class="toolbar"><div><h2>ساختار سه‌سطحی</h2><p>دسته‌بندی ← زیردسته ← سرویس</p></div><button class="add" id="addCat">+ دسته‌بندی</button></div><div id="catalogList"></div></section><section id="announce" class="tab"><div class="toolbar"><div><h2>اعلانات ۲۴ ساعته</h2><p>اعلان منقضی‌شده خودکار در سایت نمایش داده نمی‌شود.</p></div><button class="add" id="addAnn">+ اعلان</button></div><div id="annList"></div></section><section id="reviews" class="tab"><div class="toolbar"><div><h2>نظرات مشتریان</h2><p>بدون ستاره؛ فقط متن و نام مشتری.</p></div></div><div id="revList"></div></section><section id="settings" class="tab"><div class="panel"><h2>تنظیمات سایت</h2><form id="settingsForm" class="form"></form></div></section></main></div><div id="modal" class="modal"><div class="modal-box"><button id="closeModal" class="close">×</button><h2 id="modalTitle"></h2><form id="modalForm" class="form"></form></div></div><script src="/admin.js"></script></body></html>
