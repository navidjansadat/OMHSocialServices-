<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMH Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:1200px;margin:auto;padding:30px 5%"><div id="login" class="form-card"><h2>🔐 پنل مدیریت OMH</h2><input id="pass" type="password" placeholder="ADMIN_PASSWORD"><button class="btn" onclick="login()">ورود</button><p id="msg"></p></div><div id="panel" hidden><header style="position:static;margin:-30px -5% 30px"><b>OMH Admin</b><button class="btn" onclick="logout()">خروج</button></header><div class="form-card"><h2>⚙️ اطلاعات عمومی و ارتباطی</h2><div id="settings"></div><button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button></div><div class="form-card" style="margin-top:20px"><h2>🧩 مدیریت خدمات</h2><button class="btn" onclick="addService()">➕ افزودن سرویس</button><div id="services"></div></div><div class="form-card" style="margin-top:20px"><h2>⭐ نظرات مشتریان</h2><div id="reviews"></div></div><div class="form-card" style="margin-top:20px"><h2>📦 سفارش‌ها</h2><div id="orders"></div></div></div></main><script>let D;const $=s=>document.querySelector(s);async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pass').value})});let j=await r.json();if(r.ok){$('#login').hidden=true;$('#panel').hidden=false;load()}else $('#msg').textContent=j.error}async function load(){let r=await fetch('/api/admin');if(!r.ok)return;D=await r.json();renderSettings();renderServices();renderReviews();renderOrders()}function inp(k,v){return `<label>${k}<input data-k="${k}" value="${String(v||'').replaceAll('"','&quot;')}"></label>`}function renderSettings(){const keys=['brand','tagline','description','heroTitle','heroText','aboutTitle','aboutText','whatsapp','whatsappChannel','whatsappGroup','telegramChannel','telegram','email','payment'];$('#settings').innerHTML=keys.map(k=>inp(k,D.settings[k])).join('')}async function saveSettings(){let o={};document.querySelectorAll('#settings [data-k]').forEach(x=>o[x.dataset.k]=x.value);await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});alert('ذخیره شد')}function renderServices(){let html='';for(const x of D.services){html+=`<div class="card" style="margin-top:12px"><input id="c${x.id}" value="${x.category}"><input id="n${x.id}" placeholder="نام سرویس" value="${x.name||''}"><input id="p${x.id}" placeholder="قیمت" value="${x.price||''}"><input id="u${x.id}" placeholder="واحد" value="${x.unit||''}"><input id="i${x.id}" placeholder="آیکن" value="${x.icon||''}"><textarea id="d${x.id}" placeholder="توضیحات">${x.description||''}</textarea><label><input type="checkbox" id="a${x.id}" ${x.active?'checked':''}> فعال</label><button class="btn" onclick="saveService(${x.id})">ذخیره</button> <button class="btn ghost" onclick="delService(${x.id})">حذف</button></div>`}$('#services').innerHTML=html}async function saveService(id){let o={category:$('#c'+id).value,name:$('#n'+id).value,price:$('#p'+id).value,unit:$('#u'+id).value,icon:$('#i'+id).value,description:$('#d'+id).value,active:$('#a'+id).checked};await fetch('/api/services/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});load()}async function addService(){await fetch('/api/services',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:'New Section',name:'',active:1})});load()}async function delService(id){if(confirm('حذف شود؟')){await fetch('/api/services/'+id,{method:'DELETE'});load()}}function renderReviews(){$('#reviews').innerHTML=D.reviews.map(x=>`<div class="card" style="margin-top:10px"><b>${x.name}</b> — ${'★'.repeat(x.rating)}<p>${x.comment}</p><button class="btn" onclick="review(${x.id},${!x.approved})">${x.approved?'لغو انتشار':'تایید انتشار'}</button> <button class="btn ghost" onclick="delReview(${x.id})">حذف</button></div>`).join('')||'<p>نظری نیست</p>'}async function review(id,a){await fetch('/api/reviews/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:a})});load()}async function delReview(id){await fetch('/api/reviews/'+id,{method:'DELETE'});load()}function renderOrders(){$('#orders').innerHTML=D.orders.map(x=>`<div class="card" style="margin-top:10px"><b>#${x.id} ${x.name}</b><p>${x.service} | ${x.quantity} | ${x.contact}<br>${x.message||''}</p><select onchange="status(${x.id},this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='processing'?'selected':''}>processing</option><option ${x.status==='done'?'selected':''}>done</option><option ${x.status==='cancelled'?'selected':''}>cancelled</option></select></div>`).join('')||'<p>سفارشی نیست</p>'}async function status(id,v){await fetch('/api/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:v})})}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}</script></body></html>
