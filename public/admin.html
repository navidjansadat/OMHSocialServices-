<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMH Admin Panel</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{width:min(1250px,92%);margin:auto;padding:35px 0 70px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.admin-title{font-size:28px;font-weight:950}.admin-grid{display:grid;gap:20px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.admin-card h2{font-size:19px;margin-bottom:15px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:#f8fcfb;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;outline:0}.field textarea{min-height:85px;resize:vertical}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.admin-btn{border:0;border-radius:11px;padding:9px 14px;background:var(--green);color:#fff;font-weight:900;font-size:10px}.admin-btn.ghost{background:#eff8f5;color:var(--green2);border:1px solid var(--line)}.admin-btn.danger{background:#a83c45;color:#fff}.service-admin{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:11px}.service-admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.service-admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:10px}.service-admin-grid .full{grid-column:1/-1}.badge-status{font-size:8px;padding:4px 8px;border-radius:99px;background:var(--mint);color:var(--green2)}.list-item{padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:9px}.list-item p{color:var(--muted);font-size:10px;margin:5px 0}.empty{color:var(--muted);font-size:11px;padding:10px}.login-box{max-width:430px;margin:12vh auto}.login-box input{width:100%;margin:12px 0;padding:13px;border-radius:13px;background:#f8fcfb;color:var(--ink);border:1px solid var(--line)}#panel[hidden],#login[hidden]{display:none}.announcement-admin{display:grid;grid-template-columns:1.5fr 1fr auto;gap:9px;align-items:end}.announcement-admin .field input{height:43px}@media(max-width:700px){.settings-grid,.service-admin-grid,.announcement-admin{grid-template-columns:1fr}.field.full,.service-admin-grid .full{grid-column:auto}.admin-title{font-size:22px}}
</style></head><body><div class="admin-wrap">
<div id="login" class="admin-card login-box"><div class="admin-title">OMH / ADMIN</div><p class="muted">رمز همان ADMIN_PASSWORD تنظیم‌شده در Render است.</p><input id="password" type="password" placeholder="ADMIN_PASSWORD"><button class="admin-btn" onclick="login()">ورود به پنل</button><p id="loginMsg" class="form-message"></p></div>
<div id="panel" hidden><div class="admin-top"><div><div class="admin-title">پنل مدیریت OMH</div><span class="muted">مدیریت کامل سایت، سرویس‌ها، اعلان‌ها، نظرات و سفارش‌ها</span></div><button class="admin-btn ghost" onclick="logout()">خروج</button></div><div class="admin-grid">
<section class="admin-card"><h2>📢 اعلانات ۲۴ ساعته</h2><div class="announcement-admin"><div class="field"><label>متن اعلان</label><input id="annText" placeholder="مثلاً تخفیف ویژه فقط تا امشب..."></div><div class="field"><label>زمان پایان</label><input id="annExpire" type="datetime-local"></div><button class="admin-btn" onclick="addAnnouncement()">افزودن اعلان</button></div><div id="announcements"></div></section>
<section class="admin-card"><h2>🌐 اطلاعات عمومی و ارتباطی</h2><div id="settings" class="settings-grid"></div><div class="admin-actions"><button class="admin-btn" onclick="saveSettings()">ذخیره تنظیمات</button></div><p id="settingsMsg" class="form-message"></p></section>
<section class="admin-card"><h2>🧩 بخش‌ها و سرویس‌ها</h2><div class="admin-actions"><button class="admin-btn" onclick="addCategory()">➕ افزودن بخش</button><button class="admin-btn ghost" onclick="addService()">➕ افزودن سرویس</button></div><div id="services"></div></section>
<section class="admin-card"><h2>💬 نظرات مشتریان</h2><div id="reviews"></div></section>
<section class="admin-card"><h2>📦 سفارش‌ها</h2><div id="orders"></div></section>
</div></div></div><script>
let D=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'خطا');return j}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#login').hidden=true;$('#panel').hidden=false;await load()}catch(e){$('#loginMsg').textContent=e.message}}
async function load(){try{D=await api('/api/admin');renderSettings();renderServices();renderReviews();renderOrders();renderAnnouncements()}catch(e){location.reload()}}
const keys=[['brand','نام برند'],['tagline','شعار'],['description','توضیحات'],['heroTitle','عنوان اصلی'],['heroText','متن اصلی'],['aboutTitle','عنوان درباره ما'],['aboutText','متن درباره ما'],['whatsapp','شماره WhatsApp'],['whatsappChannel','لینک کانال WhatsApp'],['whatsappGroup','لینک گروپ WhatsApp'],['telegramChannel','لینک کانال Telegram'],['telegram','آیدی Telegram مثل @omhsocial'],['email','ایمیل'],['payment','روش پرداخت']];
function renderSettings(){$('#settings').innerHTML=keys.map(([k,l])=>`<div class="field ${['description','heroText','aboutText'].includes(k)?'full':''}"><label>${l}</label>${['description','heroText','aboutText'].includes(k)?`<textarea data-key="${k}">${esc(D.settings[k]||'')}</textarea>`:`<input data-key="${k}" value="${esc(D.settings[k]||'')}">`}</div>`).join('')}
async function saveSettings(){const o={};document.querySelectorAll('[data-key]').forEach(x=>o[x.dataset.key]=x.value);try{await api('/api/settings',{method:'PUT',body:JSON.stringify(o)});$('#settingsMsg').textContent='تنظیمات ذخیره شد.'}catch(e){$('#settingsMsg').textContent=e.message}}
function renderServices(){const cats=[...new Set(D.services.map(x=>x.category))];$('#services').innerHTML=cats.map(cat=>{const items=D.services.filter(x=>x.category===cat);return `<div class="service-admin"><div class="service-admin-head"><b>📁 ${esc(cat)}</b><button class="admin-btn danger" onclick="deleteCategory('${encodeURIComponent(cat)}')">حذف بخش</button></div>${items.map(x=>`<div class="service-admin"><div class="service-admin-grid"><div class="field"><label>بخش</label><input id="c${x.id}" value="${esc(x.category)}"></div><div class="field"><label>نام سرویس</label><input id="n${x.id}" value="${esc(x.name)}"></div><div class="field"><label>قیمت</label><input id="p${x.id}" value="${esc(x.price)}" placeholder="مثلاً 60"></div><div class="field"><label>واحد</label><input id="u${x.id}" value="${esc(x.unit||'AFN')}"></div><div class="field"><label>آیکن یا URL آیکن</label><input id="i${x.id}" value="${esc(x.icon||'')}" placeholder="URL یا نام شبکه"></div><div class="field"><label>ترتیب</label><input id="s${x.id}" type="number" value="${Number(x.sort)||0}"></div><div class="field full"><label>توضیحات</label><textarea id="d${x.id}">${esc(x.description)}</textarea></div><div class="field full"><label>URL عکس بخش/سرویس (اختیاری)</label><input id="im${x.id}" value="${esc(x.image||'')}" placeholder="https://..."></div></div><div class="admin-actions"><button class="admin-btn" onclick="saveService(${x.id})">ذخیره</button><button class="admin-btn ghost" onclick="toggleService(${x.id},${x.active?0:1})">${x.active?'غیرفعال':'فعال'}</button><button class="admin-btn danger" onclick="deleteService(${x.id})">حذف</button></div></div>`).join('')}</div>`}).join('')||'<div class="empty">هیچ بخشی وجود ندارد.</div>'}
async function addCategory(){const c=prompt('نام بخش جدید:');if(!c?.trim())return;try{await api('/api/categories',{method:'POST',body:JSON.stringify({category:c.trim()})});await load()}catch(e){alert(e.message)}}
async function addService(){const cats=[...new Set(D.services.map(x=>x.category))];const c=prompt('نام بخش:',cats[0]||'Facebook Service');if(!c?.trim())return;try{await api('/api/services',{method:'POST',body:JSON.stringify({category:c.trim(),name:'سرویس جدید',description:'',unit:'AFN',price:'',icon:'',active:true})});await load()}catch(e){alert(e.message)}}
async function saveService(id){const x=D.services.find(x=>x.id===id);const o={category:$('#c'+id).value,name:$('#n'+id).value,price:$('#p'+id).value,unit:$('#u'+id).value,icon:$('#i'+id).value,sort:Number($('#s'+id).value)||0,description:$('#d'+id).value,image:$('#im'+id).value,active:!!x.active};try{await api('/api/services/'+id,{method:'PUT',body:JSON.stringify(o)});await load()}catch(e){alert(e.message)}}
async function toggleService(id,active){const x=D.services.find(x=>x.id===id);try{await api('/api/services/'+id,{method:'PUT',body:JSON.stringify({...x,active:!!active})});await load()}catch(e){alert(e.message)}}
async function deleteService(id){if(!confirm('این سرویس حذف شود؟'))return;try{await api('/api/services/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}async function deleteCategory(c){if(!confirm('تمام سرویس‌های این بخش حذف شود؟'))return;try{await api('/api/categories/'+c,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
function renderReviews(){$('#reviews').innerHTML=D.reviews.map(x=>`<div class="list-item"><b>${esc(x.name)}</b> <span class="badge-status">${x.approved?'منتشر شده':'در انتظار تایید'}</span><p>${esc(x.comment)}</p><div class="admin-actions"><button class="admin-btn" onclick="approveReview(${x.id},${x.approved?0:1})">${x.approved?'لغو انتشار':'تایید انتشار'}</button><button class="admin-btn danger" onclick="deleteReview(${x.id})">حذف</button></div></div>`).join('')||'<div class="empty">نظری وجود ندارد.</div>'}
async function approveReview(id,a){try{await api('/api/reviews/'+id,{method:'PUT',body:JSON.stringify({approved:!!a})});await load()}catch(e){alert(e.message)}}async function deleteReview(id){if(!confirm('نظر حذف شود؟'))return;try{await api('/api/reviews/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
function renderOrders(){$('#orders').innerHTML=D.orders.map(x=>`<div class="list-item"><b>#${x.id} — ${esc(x.name)}</b><p>سرویس: ${esc(x.service)}<br>تعداد: ${esc(x.quantity)}<br>تماس: ${esc(x.contact)}<br>توضیحات: ${esc(x.message)}</p><select onchange="orderStatus(${x.id},this.value)"><option value="new" ${x.status==='new'?'selected':''}>جدید</option><option value="processing" ${x.status==='processing'?'selected':''}>در حال انجام</option><option value="done" ${x.status==='done'?'selected':''}>تکمیل</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>لغو</option></select><button class="admin-btn danger" onclick="deleteOrder(${x.id})">حذف</button></div>`).join('')||'<div class="empty">سفارشی وجود ندارد.</div>'}
async function orderStatus(id,status){try{await api('/api/orders/'+id,{method:'PUT',body:JSON.stringify({status})})}catch(e){alert(e.message)}}async function deleteOrder(id){if(!confirm('سفارش حذف شود؟'))return;try{await api('/api/orders/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
function toLocal(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function renderAnnouncements(){$('#announcements').innerHTML=D.announcements.map(x=>`<div class="list-item"><div class="field"><label>متن اعلان</label><input id="at${x.id}" value="${esc(x.text)}"></div><div class="field"><label>پایان</label><input id="ae${x.id}" type="datetime-local" value="${toLocal(x.expires_at)}"></div><div class="admin-actions"><button class="admin-btn" onclick="saveAnnouncement(${x.id})">ذخیره</button><button class="admin-btn ghost" onclick="toggleAnnouncement(${x.id},${x.active?0:1})">${x.active?'غیرفعال':'فعال'}</button><button class="admin-btn danger" onclick="deleteAnnouncement(${x.id})">حذف</button></div></div>`).join('')||'<div class="empty">اعلانی وجود ندارد.</div>'}
async function addAnnouncement(){const text=$('#annText').value.trim(),v=$('#annExpire').value;if(!text||!v)return alert('متن و زمان پایان را وارد کنید.');try{await api('/api/announcements',{method:'POST',body:JSON.stringify({text,expires_at:new Date(v).toISOString(),active:true})});$('#annText').value='';await load()}catch(e){alert(e.message)}}
async function saveAnnouncement(id){try{await api('/api/announcements/'+id,{method:'PUT',body:JSON.stringify({text:$('#at'+id).value,expires_at:new Date($('#ae'+id).value).toISOString(),active:true})});await load()}catch(e){alert(e.message)}}
async function toggleAnnouncement(id,a){const x=D.announcements.find(x=>x.id===id);try{await api('/api/announcements/'+id,{method:'PUT',body:JSON.stringify({...x,active:!!a})});await load()}catch(e){alert(e.message)}}async function deleteAnnouncement(id){if(!confirm('اعلان حذف شود؟'))return;try{await api('/api/announcements/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
</script></body></html>
